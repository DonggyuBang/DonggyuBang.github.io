olor:#fff;border-radius:10px;padding:12px 13px;outline:none}@media(max-width:700px){.alumni-head{display:block}.alumni-toolbar{align-items:stretch;flex-direction:column}.alumni-count{padding-left:4px}}</style><title>People | BERL</title></head><body data-page="people"><div id="site-header"></div><main><section class="page-hero"><div class="container"><div class="kicker">BERL / People</div><h1>People</h1><p>Researchers working across BERL.</p><div class="content-admin-actions" data-people-admin hidden><button class="btn btn-primary" id="people-add-member" type="button">Add Member</button><button class="btn btn-ghost" id="people-add-alumni" type="button">Add Alumni</button><a class="btn btn-ghost" href="people-manage.html">Manage People</a></div></div></section><section><div class="container"><div id="people-groups"></div></div></section><section class="alumni-section" id="alumni"><div class="container"><div class="alumni-head"><div><div class="kicker">BERL Network</div><h2>Alumni</h2></div></div><div class="alumni-toolbar"><input class="alumni-search" id="alumni-search" type="search" placeholder="Search name, affiliation, or email" aria-label="Search alumni"><div class="alumni-count" id="alumni-count"></div></div><div class="alumni-table-wrap"><table class="alumni-table"><thead><tr><th>Name</th><th>Affiliation</th><th>Email</th></tr></thead><tbody id="alumni-table-body"></tbody></table></div></div></section><section class="section-alt"><div class="container"><div class="section-head"><div><div class="kicker">Contact</div><h2>Work with BERL.</h2></div><p>Graduate admission · collaboration · academic exchange</p></div><a class="btn btn-primary" href="contact.html">Contact BERL</a></div></section></main><div id="site-footer"></div>
