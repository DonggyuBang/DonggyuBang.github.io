  <title>Facilities | BERL</title>

<body data-page="facilities">

  <h3>${BERL.esc(x.name)}</h3><p>${BERL.esc(x.description)}</p></article>`));
</script>

</main>
<div id="site-footer"></div>
<script src="assets/js/site.js"></script>
