<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="BERL news and research stories."><meta name="theme-color" content="#061525"><link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/style.css?v=20260829e"><link rel="stylesheet" href="assets/css/editorial.css?v=20260903sync1" data-editorial="1"><link rel="stylesheet" href="assets/css/polish.css?v=20260829e" data-polish="1"><link rel="stylesheet" href="assets/css/news-editor.css?v=20260903news2"><style>html:not(.berl-cms-ready) body{opacity:0}html.berl-cms-ready body{opacity:1;transition:opacity .08s ease}</style><title>News | BERL</title></head><body data-page="news"><div id="site-header"></div><main><section class="page-hero"><div class="container"><div class="kicker">BERL / Journal</div><h1>News</h1><p>Research stories and laboratory updates.</p><div class="news-page-actions" hidden><button class="btn btn-primary news-write-btn" id="news-write-btn" type="button" disabled hidden>Write</button><a class="btn btn-ghost" id="news-manage-btn" href="news-manage.html" hidden>Manage News</a><span class="news-write-note" id="news-write-note" hidden></span></div></div></section><section><div class="container"><div id="news-feature"></div></div></section><section class="section-alt"><div class="container"><div class="section-head"><div><div class="kicker">Archive</div><h2>Stories</h2></div></div><div class="news-grid" id="news-list"></div><nav class="news-pagination" id="news-pagination" aria-label="News pages"></nav></div></section></main><div id="site-footer"></div>
<div class="news-composer" id="news-composer" hidden aria-hidden="true"><div class="news-composer-shell"><header class="news-composer-top"><div class="news-composer-brand"><strong>BERL NEWS</strong><span>Story editor</span></div><div class="news-composer-actions"><span class="news-composer-status" id="news-composer-status"></span><button class="news-editor-btn" id="news-composer-close" type="button">Close</button><button class="news-editor-btn primary" id="news-publish" type="button">Publish</button></div></header><div class="news-compose-layout"><section class="news-compose-main"><textarea class="news-title-input" id="news-title" placeholder="Title" aria-label="News title"></textarea><textarea class="news-summary-input" id="news-summary" placeholder="Write a short summary shown on the news card…" aria-label="News summary"></textarea><div class="news-editor-toolbar" id="news-editor-toolbar" aria-label="Article formatting"><button class="news-tool" type="button" data-cmd="formatBlock" data-value="p">Text</button><button class="news-tool" type="button" data-cmd="formatBlock" data-value="h2">H2</button><button class="news-tool" type="button" data-cmd="bold"><strong>B</strong></button><button class="news-tool" type="button" data-cmd="italic"><em>I</em></button><button class="news-tool" type="button" data-cmd="underline"><u>U</u></button><button class="news-tool" type="button" data-cmd="insertUnorderedList">• List</button><button class="news-tool" type="button" data-cmd="insertOrderedList">1. List</button><button class="news-tool" type="button" id="news-add-link">Link</button><button class="news-tool" type="button" id="news-add-image">Image</button><button class="news-tool" type="button" data-cmd="removeFormat">Clear</button></div><div class="news-body-editor" id="news-body-editor" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="true"></div><input id="news-inline-image-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden></section><aside class="news-compose-side"><div class="news-compose-panel"><h3>Post settings</h3><div class="news-field"><label for="news-date">Date</label><input class="news-input" id="news-date" type="date"></div><div class="news-field"><label for="news-category">Category</label><input class="news-input" id="news-category" type="text" value="Lab Update" placeholder="Lab Update"></div><div class="news-field"><label for="news-slug">URL slug</label><input class="news-input" id="news-slug" type="text" placeholder="generated-from-title"></div></div><div class="news-compose-panel"><h3>Cover image</h3><div class="news-cover-drop"><div class="news-cover-preview" id="news-cover-preview"><span>No cover image</span></div><div class="news-cover-buttons"><button class="news-image-button" id="news-cover-select" type="button">Choose image</button><button class="news-image-button" id="news-cover-remove" type="button">Remove</button></div><input id="news-cover-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden></div></div><div class="news-compose-panel"><p class="news-publish-hint">Publishing adds the story directly to the News page in date order. Only BERL administrator accounts can publish.</p><div class="news-editor-error" id="news-editor-error"></div></div></aside></div></div></div>
