<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Laboratory news, publications, conferences, awards, announcements, and recent BERL activities.">
  <title>News | BERL</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="news">
<div id="site-header"></div>
<main>
  <section class="page-hero">
    <div class="container"><div class="kicker">BERL · Hanyang University</div><h1>News</h1><p>Laboratory news, publications, conferences, awards, announcements, and recent BERL activities.</p></div>
  </section>
  
<section><div class="container"><div class="grid-3" id="news-list"></div></div></section>
<script>
document.addEventListener("DOMContentLoaded",()=>renderCards("data/news.json","news-list",n=>`
  <article class="card news-card"><div class="date">${BERL.esc(n.date)}</div><h3>${BERL.esc(n.title)}</h3>
  <p>${BERL.esc(n.summary)}</p>${n.url?`<br><a href="${BERL.esc(n.url)}">Read more →</a>`:""}</article>`));
</script>

</main>
<div id="site-footer"></div>
<script src="assets/js/site.js"></script>
<script src="assets/js/data-pages.js"></script>
</body>
</html>
