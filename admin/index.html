<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BERL Admin</title>
  <link rel="stylesheet" href="../assets/css/admin.css?v=20260902a">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <span class="admin-eyebrow">BERL</span>
        <h1>Website Administration</h1>
      </div>
      <div class="admin-header-actions">
        <a class="admin-link" href="../index.html">View website ↗</a>
        <button class="admin-btn admin-btn-secondary" id="logoutBtn" type="button" hidden>Log out</button>
      </div>
    </header>

    <section class="admin-card" id="setupNotice" hidden>
      <h2>Supabase setup required</h2>
      <p>Open <code>assets/js/supabase-config.js</code> and add your Supabase Project URL and Publishable Key. Then run <code>supabase/berl-admin-setup.sql</code> in the Supabase SQL Editor.</p>
    </section>

    <section class="admin-card admin-login" id="loginPanel">
      <span class="admin-eyebrow">Administrator</span>
      <h2>Sign in</h2>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="admin-btn admin-btn-primary" type="submit">Sign in</button>
      </form>
      <p class="admin-status" id="loginStatus"></p>
    </section>

    <section id="dashboard" hidden>
      <div class="admin-toolbar">
        <div>
          <span class="admin-eyebrow">Content</span>
          <h2>News</h2>
        </div>
        <div class="admin-toolbar-actions">
          <button class="admin-btn admin-btn-secondary" id="importBtn" type="button">Import existing JSON</button>
          <button class="admin-btn admin-btn-primary" id="newBtn" type="button">+ Add news</button>
        </div>
      </div>

      <p class="admin-status" id="dashboardStatus"></p>
      <div class="admin-list" id="newsAdminList"></div>
    </section>
  </main>

  <dialog class="admin-dialog" id="editorDialog">
    <form method="dialog" id="editorForm">
      <div class="admin-dialog-head">
        <div>
          <span class="admin-eyebrow">News editor</span>
          <h2 id="editorTitle">Add news</h2>
        </div>
        <button class="admin-icon-btn" value="cancel" aria-label="Close" type="button" id="closeEditorBtn">×</button>
      </div>

      <input id="newsId" type="hidden">
      <label>Title<input id="newsTitle" required></label>
      <div class="admin-grid-2">
        <label>Date<input id="newsDate" type="date" required></label>
        <label>Category<input id="newsCategory" placeholder="Lab Update"></label>
      </div>
      <label>Slug<input id="newsSlug" required placeholder="new-research-story"></label>
      <label>Summary<textarea id="newsSummary" rows="4"></textarea></label>
      <label>Image URL<input id="newsImage" placeholder="assets/images/... or https://..."></label>
      <label>Article body JSON<textarea id="newsBody" rows="12" spellcheck="false" placeholder='[{"type":"paragraph","text":"Article text"}]'></textarea></label>
      <label class="admin-check"><input id="newsPublished" type="checkbox" checked> Published</label>

      <div class="admin-dialog-actions">
        <button class="admin-btn admin-btn-secondary" type="button" id="cancelEditorBtn">Cancel</button>
        <button class="admin-btn admin-btn-primary" type="submit">Save</button>
      </div>
      <p class="admin-status" id="editorStatus"></p>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js?v=20260902a"></script>
  <script src="../assets/js/admin.js?v=20260902a"></script>
</body>
</html>
